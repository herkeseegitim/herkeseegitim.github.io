html{--zemin:#0b1330;--altin:#c9a44a;--krem:#f3ead2}
html,body{margin:0;height:100%;background:#0b1330;background:var(--zemin);color:#f3ead2;color:var(--krem);overflow:hidden;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"DejaVu Sans",sans-serif}
#sahne{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.yok{display:none !important}
#panel{position:fixed;left:0;right:0;bottom:0;box-sizing:border-box;padding:10px 12px 6px;text-align:center}
.sira{max-width:560px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end}
.alan{flex:1 1 100%;margin:0 4px 8px;text-align:left}
label{display:block;font-size:.9rem;color:#eadfb9;margin:0 0 4px 2px}
label span{color:#b3ab90}
input{width:100%;min-height:64px;box-sizing:border-box;font-size:1.3rem;padding:0 16px;border:1px solid #c9a44a;border-color:var(--altin);border-radius:10px;background:#f6efdd;color:#1c2550;font-family:Georgia,"Times New Roman","DejaVu Serif",serif}
.dugme{min-height:64px;box-sizing:border-box;font:inherit;font-size:1.1rem;border-radius:10px;border:1px solid #c9a44a;border-color:var(--altin);background:rgba(14,22,54,.82);color:#f3ead2;color:var(--krem);padding:0 14px;margin:4px;flex:1 1 40%;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.dugme.ana{background:#e2bd5c;background:linear-gradient(#f0d583,#cfa23f);color:#151c40;border-color:#f3dc94;font-weight:600}
#ac{flex:1 1 100%}
.dugme[disabled]{opacity:.6;cursor:default}
input:focus,.dugme:focus{outline:3px solid #fff0b5;outline-offset:2px}
#sesNot{flex:1 1 100%;margin:0 4px 8px;font-size:.95rem;color:#ffe9b0;text-align:center}
input::placeholder{color:#8a8473;opacity:1}
#video{flex:1 1 100%}
#dugmeler .dugme{flex:1 1 28%;padding:0 8px;font-size:1rem}
#dugmeler #video{flex:1 1 100%;font-size:1.1rem}
#bilgi{flex:1 1 100%;margin:2px 4px 0;font-size:.95rem;color:#ffe9b0}
#bilgi:empty{display:none}
#uyari{flex:1 1 100%;margin:0 4px 6px;min-height:1.2em;font-size:.95rem;color:#ffd9a0}
#gizlilik{margin:4px 0 0;font-size:.8rem;color:#b3ab90}
@media (orientation:landscape) and (min-width:700px){
  .sira{max-width:1180px}
  .alan{flex:1 1 30%}
  #ac{flex:0 1 240px;margin-bottom:8px}
  .dugme,#dugmeler .dugme,#dugmeler #video{flex:1 1 20%}
  #uyari{order:9;text-align:center}
}
@media (min-width:1400px) and (min-height:800px){
  html{font-size:22px}
  input,.dugme{min-height:96px}
}
#baski{display:none}
@media print{
  @page{size:A5 landscape;margin:0}
  html,body{background:#fff !important;height:auto;overflow:visible}
  #sahne,#panel,#okur{display:none !important}
  #baski{display:block;position:relative;width:210mm;height:147mm;overflow:hidden;color:#1c2550;font-family:Georgia,"Times New Roman","DejaVu Serif",serif;page-break-inside:avoid;break-inside:avoid;-webkit-print-color-adjust:exact;color-adjust:exact;print-color-adjust:exact}
  .b-c1{position:absolute;left:8mm;top:8mm;right:8mm;bottom:8mm;border:.35mm solid #b8892b}

function hecele(w){

/* ---------- 2. Ses: müzik kutusu ---------- */
var ANA_KAZANC=0.512;

/* video */
var TURLER=['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
function videoTuru(){
  var i;
  if(!window.MediaRecorder||!tuval.captureStream)return null;
  for(i=0;i<TURLER.length;i++){try{if(MediaRecorder.isTypeSupported(TURLER[i]))return TURLER[i];}catch(x){}}
  return '';
}
function dosyaAdi(ad,tur){
  var m={'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','Ç':'C','Ğ':'G','İ':'I','Ö':'O','Ş':'S','Ü':'U','â':'a','î':'i','û':'u'},o='',i,c;
  for(i=0;i<ad.length;i++){c=ad.charAt(i);c=m[c]||c;o+=/[A-Za-z0-9]/.test(c)?c:'-';}
  o=o.replace(/-+/g,'-').replace(/^-|-$/g,'')||'kart';
  return TEMA.dosya.replace('{ad}',o)+(/mp4/.test(tur)?'.mp4':'.webm');
}
function videoTemizle(){
  if(kayitAdres){try{URL.revokeObjectURL(kayitAdres);}catch(x){}kayitAdres=null;}
  indir.removeAttribute('download');indir.setAttribute('href','#');
  bilgi.textContent='';kayitBlob=null;videoHazir=false;
  videoDugme.className=videoTuru()===null?'dugme ana yok':'dugme ana';videoDugme.disabled=false;videoDugme.textContent=M.video;
}
function kayitIptal(){
  if(!kayit)return;
  var k=kayit;kayit=null;kayitSahne=null;
  try{k.kaydedici.onstop=null;k.kaydedici.stop();}catch(x){}
  try{if(k.hedef)hat.disconnect(k.hedef);}catch(x){}
  videoDugme.disabled=false;videoDugme.textContent=videoHazir?M.videoHazir:M.video;
}
function kayitBasla(){
  var tur=videoTuru(),t,akis,izler,hedef=null,kd,parca=[],secenek={videoBitsPerSecond:6000000,audioBitsPerSecond:128000};
  if(tur===null||!sarkim)return;
  kayitIptal();videoTemizle();
  try{
    t=tuvalYap(1080,1920);kayitSahne=Sahne(t,true);kayitSahne.boyut(1080,1920,150,1730);kayitSahne.sarki(sarkim,kimden);azaltUygula();
    kayitSahne.ciz(-1,0,0);
    cal();
    akis=t.captureStream(30);izler=akis.getVideoTracks();
    if(sesli&&ac.createMediaStreamDestination){hedef=ac.createMediaStreamDestination();hat.connect(hedef);izler=izler.concat(hedef.stream.getAudioTracks());}
    if(tur)secenek.mimeType=tur;
    kd=new MediaRecorder(new MediaStream(izler),secenek);
  }catch(x){kayitSahne=null;uyariYaz(M.kayitYok);return;}
  kd.ondataavailable=function(e){if(e.data&&e.data.size)parca.push(e.data);};
  kd.onstop=function(){
    var b=new Blob(parca,{type:(kd.mimeType||tur||'video/webm').split(';')[0]});
    try{if(hedef)hat.disconnect(hedef);}catch(x){}
    kayit=null;kayitSahne=null;
    kayitAdres=URL.createObjectURL(b);
    kayitBlob=b;kayitAd=dosyaAdi(sarkim.ad,b.type);
    indir.setAttribute('href',kayitAdres);indir.setAttribute('download',kayitAd);

function uyariYaz(m){al('okur').textContent=m;videoDugme.textContent=m;videoDugme.disabled=true;}

function indirNot(){indir.click();bilgi.textContent=M.waNot;olcu();}
function paylasDosya(){
  var d=null;
  try{d=new File([kayitBlob],kayitAd,{type:kayitBlob.type});}catch(x){d=null;}
  try{if(d&&navigator.share&&navigator.canShare&&navigator.canShare({files:[d]}))return d;}catch(x){}
  return null;
}
/* Kayıt bitince çağrılır (kendiliginden) ya da "Videoyu gönder" dokunuşuyla. Paylaşım sayfası taze dokunuş ister;
   dokunuş eskidiyse düğme "Videoyu gönder" olarak bekler. Paylaşım yoksa video iner ve not çıkar. Ağ çağrısı yok. */
function gonder(kendiliginden){
  var d;
  if(!kayitBlob)return;
  d=paylasDosya();
  if(!d){indirNot();return;}
  if(kendiliginden&&navigator.userActivation&&!navigator.userActivation.isActive){bilgi.textContent=M.hazirNot;olcu();return;}
  bilgi.textContent='';
  navigator.share({files:[d],text:M.paylasim}).then(function(){},function(e){
    if(e&&e.name==='AbortError')return;
    if(e&&e.name==='NotAllowedError'){bilgi.textContent=M.hazirNot;olcu();return;}
    indirNot();
  });
}
