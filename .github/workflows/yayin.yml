name: Siteyi üret ve yayınla
on:
  push:
    branches: [main]
  schedule:
    - cron: "10 21 * * *"   # her gece 00:10 (İstanbul): tarihe bağlı bölümler yenilenir
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  uret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0 segno==1.6.6
      - run: python build.py
        env:
          TZ: Europe/Istanbul
          SITE: https://herkeseegitim.com
          CNAME: herkeseegitim.com
          ADRES_DENE: "1"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
  yayinla:
    needs: uret
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
