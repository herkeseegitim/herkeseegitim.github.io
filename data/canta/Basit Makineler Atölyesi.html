<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basit Makineler Atölyesi</title>
<style>
:root{
  --kagit:#FBF8EF; --kagit2:#EEF3F8; --murekkep:#16263D; --soluk:#4E5D70;
  --turuncu:#E8772E; --kirmizi:#E0362C; --sari:#FFC21A; --yesil:#2F7D4F; --mavi:#2F5FA8;
  --ip:#8A5A2B; --cizgi:#C9D6E3; --zemin:#E6EDF4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--kagit);color:var(--murekkep);font:18px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--mavi);outline-offset:2px}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#1B3A5C;color:#FBF8EF}
.seri{background:#FFFDF6;color:#16263D;font-size:12px;font-weight:800;letter-spacing:.6px;padding:4px 10px;border:1.5px dashed #9FB3C8;transform:rotate(-1.5deg);white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
header h1{font-size:20px;margin:0 10px 0 2px;white-space:nowrap;font-weight:700}
header h1 span{color:var(--sari)}
.sekmeler{display:flex;gap:6px;flex:1;min-width:0}
.sekme{background:transparent;border:2px solid #3E5F82;color:var(--kagit);border-radius:10px;padding:6px 14px;font-weight:600;white-space:nowrap;min-height:44px}
.sekme[aria-selected=true]{background:var(--sari);color:var(--murekkep);border-color:var(--sari)}
.ust-dugme{background:transparent;border:2px solid #3E5F82;color:var(--kagit);border-radius:10px;padding:6px 12px;white-space:nowrap;min-height:44px}
.gorunum{height:calc(100% - 56px);display:none}
.gorunum.acik{display:grid}
/* Atölye */
#atolye{grid-template-columns:84px minmax(0,1fr) clamp(330px,26vw,520px);gap:10px;padding:10px}
#gorevListe{display:flex;flex-direction:column;gap:6px;overflow:auto}
.gdug{border:3px solid var(--murekkep);background:#fff;border-radius:12px;padding:4px 2px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:20px;position:relative}
.gdug small{font-size:11px;font-weight:600;line-height:1.1;text-align:center}
.gdug[aria-current=true]{background:var(--sari);box-shadow:3px 3px 0 var(--murekkep)}
.gdug .tik{position:absolute;top:2px;right:4px;width:16px;height:16px}
#orta{display:flex;flex-direction:column;min-width:0;min-height:0;gap:8px}
#sahneKutu{flex:1;min-height:0;background:#fff;border:3px solid var(--murekkep);border-radius:14px;position:relative;overflow:hidden}
#sahne{width:100%;height:100%;display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
#sahneNot{position:absolute;left:10px;top:8px;right:10px;font-size:16px;color:var(--soluk);pointer-events:none}
#olcum{display:grid;grid-template-columns:1.1fr 0.8fr 1.4fr;gap:8px}
.kutu{background:#fff;border:2px solid var(--murekkep);border-radius:12px;padding:6px 10px;min-width:0}
.kutu .kh{margin:0 0 3px;font-size:13px;text-transform:none;color:var(--soluk);font-weight:700;letter-spacing:.2px}
.deger{font-size:20px;font-weight:800;white-space:nowrap}
.cubuk{height:14px;background:var(--zemin);border:1.5px solid var(--murekkep);border-radius:7px;position:relative;overflow:hidden;margin-top:4px}
.cubuk i{position:absolute;left:0;top:0;bottom:0;background:var(--turuncu)}
.cubuk i.asti{background:repeating-linear-gradient(45deg,var(--kirmizi) 0 6px,#fff 6px 10px)}
.cubuk b{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--murekkep)}
.is-satir{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-satir .cubuk{flex:1;margin:0;height:11px}
.is-satir .cubuk i.yuk{background:var(--mavi)}
.kucuk{font-size:14px;color:var(--soluk)}
/* panel */
#panel{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding-right:2px;overscroll-behavior:contain;scroll-padding-bottom:72px}
#panel .kart:last-child{padding-bottom:0}
.kart{background:#fff;border:3px solid var(--murekkep);border-radius:14px;padding:10px 12px}
.kart h2{margin:0 0 4px;font-size:21px}
#gorevBaslik:focus{outline:none}
.kart p{margin:4px 0}
.etiketler{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.etiket{border:2px solid var(--murekkep);border-radius:20px;padding:1px 9px;font-size:14px;font-weight:600;background:var(--kagit)}
.etiket.yuk{background:#E3ECFA}
.etiket.sinir{background:#FDE3D2}
.adimlar{display:flex;gap:4px;margin-bottom:6px}
.adim{flex:1;text-align:center;font-size:13px;font-weight:700;padding:3px 0;border-radius:8px;border:2px solid var(--cizgi);color:var(--soluk)}
.adim.simdi{border-color:var(--murekkep);background:var(--sari);color:var(--murekkep)}
.adim.gecti{border-color:var(--murekkep);color:var(--murekkep)}
.secenekler{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.secenek{text-align:left;background:var(--kagit);border:2px solid var(--murekkep);border-radius:10px;padding:8px 10px;min-height:44px}
.secenek[aria-pressed=true]{background:var(--sari);box-shadow:2px 2px 0 var(--murekkep)}
.geri{margin-top:8px;padding:8px 10px;border-left:6px solid var(--turuncu);background:var(--kagit)}
.geri.iyi{border-left-color:var(--yesil)}
.ana{background:#B8501A;color:#fff;border:3px solid var(--murekkep);border-radius:12px;padding:9px 14px;font-weight:800;box-shadow:3px 3px 0 var(--murekkep)}
.ana:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--murekkep)}
.ikincil{background:#fff;border:2px solid var(--murekkep);border-radius:12px;padding:7px 12px;font-weight:700}
.bag{background:none;border:none;text-decoration:underline;color:var(--soluk);padding:4px 0;font-size:15px}
.kontrol{margin-top:8px}
.kontrol .ad{font-size:14px;font-weight:700;color:var(--soluk);margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border:2px solid var(--murekkep);background:#fff;border-radius:10px;padding:6px 10px;min-height:44px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--sari);box-shadow:2px 2px 0 var(--murekkep)}
.sayi{display:flex;align-items:center;gap:8px}
.sayi button{width:52px;height:46px;border:2px solid var(--murekkep);background:#fff;border-radius:10px;font-size:24px;font-weight:800;line-height:1}
.sayi output{min-width:96px;text-align:center;font-size:20px;font-weight:800}
.eylem{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;padding:8px 0 6px;z-index:2;box-shadow:0 -8px 8px -6px rgba(38,25,11,.18)}
.mesaj{margin-top:8px;font-weight:600}
.mesaj.uyari{color:#9E1F17}
.sinirli{background:repeating-linear-gradient(45deg,#FDE3D2 0 8px,#fff 8px 14px)}
/* sınıflandır */
#sinif,#etiketle,#ogretmen{padding:10px;overflow:auto}
#sinif{grid-template-rows:auto auto 1fr;gap:8px}
.ust-yazi{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ust-yazi h2{margin:0;font-size:22px}
#kartlar{display:flex;flex-wrap:wrap;gap:8px;min-height:204px;align-content:flex-start}
.arac{width:112px;height:96px;border:2px solid var(--murekkep);border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font-size:14px;font-weight:700;touch-action:none}
.arac svg{width:76px;height:56px}
.arac[aria-pressed=true]{background:var(--sari);box-shadow:3px 3px 0 var(--murekkep)}
.arac.yerde{width:80px;height:70px;font-size:11px;line-height:1.1}
.arac.yerde svg{width:52px;height:36px}
#kutular{flex-shrink:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;min-height:0}
.aile{border:3px dashed var(--murekkep);border-radius:14px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.aile:focus,.yuva:focus{outline:4px solid var(--mavi);outline-offset:2px}
.aile.hedefle{border-style:solid;background:#FFF0C2}
.aile h3{margin:0;font-size:17px;display:flex;align-items:center;gap:6px}
.aile h3 svg{width:30px;height:30px}
.aile .icerik{display:flex;flex-wrap:wrap;gap:5px}
.aile{min-width:0}
#sinifGeri{min-height:32px}
/* etiketle */
#etiketle{grid-template-rows:auto auto 1fr auto;gap:8px}
#jetonlar{display:flex;gap:10px;flex-wrap:wrap}
.jeton{border:3px solid var(--murekkep);border-radius:24px;padding:6px 16px;background:#fff;font-weight:800;min-height:48px}
.jeton[aria-pressed=true]{background:var(--sari);box-shadow:3px 3px 0 var(--murekkep)}
#araclar3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:0}
.ucarac{background:#fff;border:3px solid var(--murekkep);border-radius:14px;padding:6px;display:flex;flex-direction:column;min-height:0}
.ucarac h3{margin:0 0 4px;font-size:18px}
.ucarac svg{width:100%;flex:1;min-height:170px}
.yuva{cursor:pointer}
/* öğretmen */
#ogretmen{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-content:start}
#ogretmen.acik{display:grid}
#ogretmen .kart h2{font-size:20px}
#ogretmen table{border-collapse:collapse;width:100%;font-size:15px}
#ogretmen td,#ogretmen th{border:1.5px solid var(--cizgi);padding:5px 6px;text-align:left;vertical-align:top}
#ogretmen ol,#ogretmen ul{margin:4px 0;padding-left:22px}
.bag[data-tahminDegis]{display:inline;font-size:14px;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:1100px){
  .arac.yerde{width:66px;height:64px;font-size:10px}
  .arac.yerde svg{width:44px;height:32px}
  .is-satir{white-space:normal}
  .deger{font-size:17px}
  #atolye{grid-template-columns:64px minmax(0,1fr) 320px}
  .gdug small{display:none}
  header h1{font-size:17px}
  .sekme{padding:6px 9px}
}
@media (max-height:620px){
  .gdug{min-height:44px}
  #gorevListe{gap:4px}
  .arac{width:90px;height:74px;font-size:12px}
  .arac svg{width:58px;height:40px}
  #sinif{grid-template-rows:auto auto auto}
  .aile{min-height:150px}
}
@media (max-height:700px){
  .kart p{margin:3px 0;font-size:15px}
  .secenek{min-height:40px;padding:5px 9px}
  .etiket{font-size:13px}
  .sayi button{height:40px}
  .seg button{min-height:40px;padding:4px 9px}
}
@media (max-height:760px){
  .kart h2{font-size:19px}
  .kart{padding:8px 10px}
  .deger{font-size:18px}
  body{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Basit Makineler <span>Atölyesi</span></h1>
  <span class="seri" title="Ders, sınıf ve kazanım">FEN · 8. SINIF · F.8.5</span>
  <div class="sekmeler" role="tablist" aria-label="Bölümler">
    <button class="sekme" role="tab" data-g="atolye" aria-selected="true">Atölye</button>
    <button class="sekme" role="tab" data-g="sinif" aria-selected="false">Sınıflandır</button>
    <button class="sekme" role="tab" data-g="etiketle" aria-selected="false">Etiketle</button>
    <button class="sekme" role="tab" data-g="ogretmen" aria-selected="false">Öğretmen</button>
  </div>
  <button class="ust-dugme" id="tamEkran" type="button">Tam ekran</button>
</header>

<main id="atolye" class="gorunum acik" aria-label="Atölye">
  <nav id="gorevListe" aria-label="Görevler"></nav>
  <div id="orta">
    <div id="sahneKutu">
      <svg id="sahne" viewBox="0 0 800 500" role="img" aria-label="Makine sahnesi"></svg>
      <div id="sahneNot" aria-live="polite"></div>
    </div>
    <div id="olcum"></div>
  </div>
  <aside id="panel"></aside>
</main>

<main id="sinif" class="gorunum" aria-label="Sınıflandır">
  <div class="ust-yazi"><h2>Hangi gruptan?</h2><span class="kucuk">Bir araca dokun, sonra grubuna dokun. Sürükleyebilirsin de.</span>
    <button class="ikincil" id="sinifBastan" type="button">Baştan</button></div>
  <div id="kartlar"></div>
  <div style="display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto">
    <div id="sinifGeri" class="geri" aria-live="polite">Çevrende her gün kullandığın araçlar. Hangi gruba girdiklerini bul.</div>
    <div id="kutular"></div>
  </div>
</main>

<main id="etiketle" class="gorunum" aria-label="Etiketle">
  <div class="ust-yazi"><h2>Destek, yük, kuvvet nerede?</h2><span class="kucuk">Bir etikete dokun, sonra araçtaki yuvaya dokun.</span></div>
  <div id="jetonlar">
    <button class="jeton" data-j="D" type="button">D · Destek</button>
    <button class="jeton" data-j="Y" type="button">Y · Yük</button>
    <button class="jeton" data-j="K" type="button">K · Kuvvet</button>
  </div>
  <div id="araclar3"></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="ana" id="etiketKontrol" type="button">Kontrol et</button>
    <button class="ikincil" id="etiketBastan" type="button">Baştan</button>
    <div id="etiketGeri" aria-live="polite" style="flex:1;min-width:260px"></div>
  </div>
</main>

<main id="ogretmen" class="gorunum" aria-label="Öğretmen"></main>
<div id="duyuru" class="sr" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ---------- yardımcılar ---------- */
function $(s){return document.querySelector(s);}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function sayi(x,ond){
  if(ond===undefined) ond = Math.abs(x)>=100 ? 0 : (Math.abs(x-Math.round(x))<0.005 ? 0 : (Math.abs(x*10-Math.round(x*10))<0.05?1:2));
  var s = (Math.round(x*Math.pow(10,ond))/Math.pow(10,ond)).toFixed(ond);
  var p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return p.join(',');
}
function kat(x){ var y=Math.round(x*100)/100; return sayi(y, Math.abs(y-Math.round(y))<1e-9?0:(Math.abs(y*10-Math.round(y*10))<1e-9?1:2))+' kat'; }
function Nond(x){return Math.abs(x-Math.round(x))<0.05?0:1;}
function N(x){return sayi(x, Nond(x))+'\u00a0N';}
function yuv(x,o){var k=Math.pow(10,o);return Math.round(x*k)/k;}
function mond(x){return x>=10?1:(Math.abs(x*10-Math.round(x*10))<0.005?1:2);}
function m(x){return sayi(x, x>=10?1:(Math.abs(x*10-Math.round(x*10))<0.005?1:2))+' m';}
function cm(x){return sayi(x*100,0)+' cm';}
function J(x){return sayi(x,0)+'\u00a0J';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var KAYIT='herkese-egitim-makine-v1';
function oku(){try{var v=localStorage.getItem(KAYIT);return v?JSON.parse(v):{};}catch(e){return {};}}
function yaz(o){try{localStorage.setItem(KAYIT,JSON.stringify(o));}catch(e){}}
var ilerleme = oku(); if(!ilerleme || typeof ilerleme!=='object' || Array.isArray(ilerleme)) ilerleme={}; if(!ilerleme.bitti || typeof ilerleme.bitti!=='object') ilerleme.bitti={};

/* ---------- görevler ---------- */
var G = [
{ id:'sabit', kisa:'Sabit makara', tur:'ip', S:80, W:200, kol:300, hedef:3, yuk:'kova',
  baslik:'Kovayı çatıya çıkar',
  durum:'Çatıdaki ustaya harç kovası lazım. İpi çekerek kovayı 3 m yukarıdaki iskeleye çıkar.',
  yukAd:'Kova', kontroller:[{k:'duzen',ad:'Düzenek',sec:[['makarasiz','Makarasız'],['sabit','Sabit makara']]}],
  bas:{duzen:'sabit'},
  tahmin:{soru:'Sabit makarayla kovayı kaldırmak için kaç N gerekir?',sec:["200 N’den az","200 N","200 N’den çok"],d:1},
  olcum:function(s,g,r){ return 'Ölçtüğün giriş kuvveti: '+N(r.F)+'.'; },
  sonuc:'Kova iskelede.',
  acikla:[
    {m:'Sabit makara kuvveti azaltmadı, yalnız yönünü değiştirdi. Aşağı çekmek daha rahat.',d:1,
     g:'Evet. Giriş kuvveti 200 N, kova da 200 N. Makarasız da 200 N gerekir, ama o zaman ipi yukarı çekersin. Çektiğin ip 3 m, kova da 3 m yükseldi.'},
    {m:'Sabit makara kuvveti yarıya indirdi.',
     g:'Dinamometreye bak: 200 N. Kova da 200 N. Kuvvet aynı kaldı, değişen yalnız yönü.'},
    {m:'Makara olmasa kovayı hiç kaldıramazdık.',
     g:'"Makarasız"ı seçip dene. 200 N senin sınırının altında, kaldırabiliyorsun. Makara işi kolaylaştırıyor çünkü aşağı doğru çekiyorsun.'}
  ]},
{ id:'hareketli', kisa:'Hareketli makara', tur:'ip', S:90, W:500, kol:300, hedef:2, yuk:'torba',
  baslik:'Çimento torbasını iskeleye çıkar',
  durum:'Torba 500 N. Sen en çok 300 N ile çekebilirsin. Torbayı 2 m yukarıdaki iskeleye çıkar.',
  yukAd:'Torba', kontroller:[{k:'duzen',ad:'Düzenek',sec:[['sabit','Sabit makara'],['hareketli','Hareketli makara']]}],
  bas:{duzen:'sabit'},
  tahmin:{soru:'Hareketli makarayla torbayı kaldırmak için kaç N gerekir?',sec:['500 N','250 N','125 N'],d:1},
  olcum:function(s,g,r){ return 'Ölçtüğün giriş kuvveti: '+N(r.F)+'.'; },
  sonuc:'Torba iskelede.',
  acikla:[
    {m:'Kuvvet yarıya indi ama ipi iki kat çektim: 4 m ip çektim, torba 2 m yükseldi.',d:1,
     g:'Evet. 250 N × 4 m = 1.000 J, 500 N × 2 m = 1.000 J. Makine kuvvetten kazandırdı, yoldan kaybettirdi.'},
    {m:'Kuvvet yarıya indi, yaptığım iş de yarıya indi.',
     g:'İş çubuklarına bak: ikisi de 1.000 J. Kuvvet yarıya inince yol iki katına çıktı, iş değişmedi.'},
    {m:'Hareketli makara kuvvetin yönünü de değiştirdi.',
     g:'Bu düzenekte ipi yukarı çektin, torba da yukarı çıktı. Yön aynı kaldı. Yönü sabit makara değiştirir.'}
  ]},
{ id:'palanga', kisa:'Palanga', tur:'ip', S:120, W:1200, kol:300, hedef:1.5, ipMax:7, yuk:'motor',
  baslik:'Motoru kaldır',
  durum:'Tamir için 1.200 N’luk motor 1,5 m kaldırılacak. Sen en çok 300 N ile çekebilirsin. Elindeki ip 7 m.',
  yukAd:'Motor',
  kontroller:[{k:'n',ad:'Yükü taşıyan ip',tip:'sayi',min:1,max:6,adim:1,bicim:function(v){return v+' ip';}},
              {k:'yon',ad:'Yön değiştiren makara',sec:[[true,'Var'],[false,'Yok']]}],
  bas:{n:2,yon:true},
  tahmin:{soru:'Motoru kaldırmak için yükü kaç ip parçası taşımalı?',sec:['2','3','4','6'],d:2},
  olcum:function(s,g,r){ return 'Yükü '+s.n+' ip taşıdı, giriş kuvveti '+N(r.F)+'.'; },
  sonuc:'Motor 1,5 m yükseldi.',
  acikla:[
    {m:'Kazancı yükü taşıyan ip sayısı belirliyor, makara sayısı değil.',d:1,
     g:'Evet. Yön değiştiren makarayı açıp kapatırsan makara sayısı değişir, kuvvet değişmez. Yükü 4 ip taşıyınca kuvvet 1.200 ÷ 4 = 300 N.'},
    {m:'Makara ekledikçe kuvvet hep azalır.',
     g:'Yön değiştiren makarayı aç, kapat ve dinamometreye bak. Makara sayısı bir arttı, kuvvet aynı kaldı.'},
    {m:'İp parçası arttıkça daha az ip çekerim.',

/* ---------- durum ---------- */
var aktif = 0, S = null;
function yeniDurum(i){
  var g=G[i], s={};
  for(var k in g.bas) s[k]=g.bas[k];
  s.h=0; s.aci=0; s.tutus=0; s.asama='tahmin'; s.tahmin=null; s.aciklama=null;
  s.hedef=g.hedef; s.kol=g.kol; s.kanitAcik=false; s.kanitBitti=false; s.uyari=''; s.basarili=false;
  s.kontroller=g.kontroller.slice();
  return s;
}
var durumlar = G.map(function(_,i){return yeniDurum(i);});

function ipDuzen(g,s){
  if(g.id==='sabit') return s.duzen==='sabit'?{n:1,yon:true}:{n:1,yon:false};
  if(g.id==='hareketli') return s.duzen==='hareketli'?{n:2,yon:false}:{n:1,yon:true};
  if(g.id==='bilesik') return {n:s.n,yon:true};
  return {n:s.n,yon:s.yon};
}

/* kuvvet kazancı, gereken kuvvet, en çok yükseklik */
function hesap(g,s){
  var r={MA:1,F:0,hMax:Infinity,neden:''};
  if(g.tur==='ip'){
    var d=ipDuzen(g,s); r.MA=d.n; r.F=g.W/d.n;
    if(g.ipMax){ r.hMax=g.ipMax/d.n; r.neden='İpin bitti: '+m(g.ipMax)+' ipin hepsini çektin, '+g.yukAd.toLowerCase()+' '+m(r.hMax)+' yükseldi.'; }
  } else if(g.tur==='kaldirac'){
    var a=s.p*0.2, b=(12-s.p)*0.2; r.MA=b/a; r.F=g.W*a/b; r.hMax=s.Hf*a/b;
    r.neden='Çubuğun ucu yere değdi. Kaya '+cm(r.hMax)+' kalktı, '+cm(s.hedef)+' gerekiyor.';
  } else if(g.tur==='rampa'){
    r.MA=s.L/g.hedef; r.F=g.W*g.hedef/s.L; r.yatay=Math.sqrt(Math.max(0,s.L*s.L-g.hedef*g.hedef));
    r.engel = r.yatay>g.yer+1e-9;
  } else if(g.tur==='cikrik'){
    r.MA=s.R/g.r; r.F=g.W*g.r/s.R;
  } else if(g.tur==='bilesik'){
    r.MA=s.n*s.R/g.r; r.F=g.W/r.MA; r.hMax=g.tambur/s.n;
    r.neden='Silindir doldu: '+m(g.tambur)+' ip sarıldı, kiriş '+cm(r.hMax)+' yükseldi.';
  }
  r.yetmez = r.F > s.kol + 1e-9;
  return r;
}

function hHam(s){ return s.hRaw===undefined? s.h : s.hRaw; }
/* elin aldığı yol */
function elYolu(g,s,r){ return s.h*r.MA; }

/* ---------- çizim ---------- */
var svg = $('#sahne');
var DESEN = '<defs>'+
 '<pattern id="tarali" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><rect width="3" height="8" fill="#16263D"/></pattern>'+
 '<pattern id="kirmiziTarali" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FDE3D2"/><rect width="4" height="10" fill="#E0362C"/></pattern>'+
 '<pattern id="toprak" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#F3E3BC"/><circle cx="4" cy="5" r="1.4" fill="#C9AE7A"/><circle cx="11" cy="11" r="1.2" fill="#C9AE7A"/></pattern>'+
 '<pattern id="kare" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M10 0V50M20 0V50M30 0V50M40 0V50M0 10H50M0 20H50M0 30H50M0 40H50" fill="none" stroke="#E1EAF3" stroke-width="1"/><path d="M50 0H0V50" fill="none" stroke="#BFD0E2" stroke-width="1.4"/></pattern>'+
 '</defs>';
var INK='#16263D';
function L(x1,y1,x2,y2,w,c,ek){return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+(c||INK)+'" stroke-width="'+(w||3)+'" stroke-linecap="round" '+(ek||'')+'/>';}
function C(x,y,r,f,w,c){return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" fill="'+(f||'#fff')+'" stroke="'+(c||INK)+'" stroke-width="'+(w===undefined?3:w)+'"/>';}
function R(x,y,w,h,f,ek){return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+(f||'#fff')+'" stroke="'+INK+'" stroke-width="3" '+(ek||'')+'/>';}
function T(x,y,t,ek){return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="17" font-weight="700" fill="'+INK+'" '+(ek||'')+'>'+esc(t)+'</text>';}
function zemin(y){return '<rect x="-2000" y="'+y+'" width="4800" height="2000" fill="url(#toprak)"/>'+L(-2000,y,2800,y,3);}
function ok(x,y,yon,renk){ // yon: 'asagi','yukari','sag','sol'
  var c=renk||'#E0362C', p;
  if(yon==='asagi') p='M'+(x-9)+' '+(y-14)+'L'+x+' '+y+'L'+(x+9)+' '+(y-14);
  else if(yon==='yukari') p='M'+(x-9)+' '+(y+14)+'L'+x+' '+y+'L'+(x+9)+' '+(y+14);
  else if(yon==='sag') p='M'+(x-14)+' '+(y-9)+'L'+x+' '+y+'L'+(x-14)+' '+(y+9);
  else p='M'+(x+14)+' '+(y-9)+'L'+x+' '+y+'L'+(x+14)+' '+(y+9);
  return '<path d="'+p+'" fill="none" stroke="'+c+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
}
function el(x,y,yon){ // tutma noktası: halka + ok
  var s=C(x,y,13,'#FFC21A',3);
  if(yon==='asagi') s+=L(x,y+16,x,y+44,4,'#E0362C')+ok(x,y+46,'asagi');
  else if(yon==='yukari') s+=L(x,y-16,x,y-44,4,'#E0362C')+ok(x,y-46,'yukari');
  return s;
}
function yukCiz(tur,cx,ust,genis){
  // ust: yükün üst kenarı (kanca noktası); döndürür: {svg, alt}
  var s='', h;
  if(tur==='kova'||tur==='su kovası'){
    h=46; s+='<path d="M'+(cx-24)+' '+(ust+8)+'L'+(cx+24)+' '+(ust+8)+'L'+(cx+18)+' '+(ust+h)+'L'+(cx-18)+' '+(ust+h)+'Z" fill="'+(tur==='su kovası'?'#9CC3E6':'#C9C1B4')+'" stroke="'+INK+'" stroke-width="3"/>';
    s+='<path d="M'+(cx-24)+' '+(ust+8)+'Q'+cx+' '+(ust-14)+' '+(cx+24)+' '+(ust+8)+'" fill="none" stroke="'+INK+'" stroke-width="3"/>';
  } else if(tur==='torba'){
    h=56; s+='<path d="M'+(cx-26)+' '+(ust+10)+'Q'+cx+' '+(ust+2)+' '+(cx+26)+' '+(ust+10)+'L'+(cx+30)+' '+(ust+h)+'L'+(cx-30)+' '+(ust+h)+'Z" fill="#E8DCC4" stroke="'+INK+'" stroke-width="3"/>'+T(cx-18,ust+44,'500 N','font-size="12"');
    s+=L(cx,ust,cx,ust+8,3);
  } else if(tur==='motor'){
    h=60; s+=R(cx-40,ust+10,80,h-10,'#B9C4CF')+R(cx-28,ust+18,56,14,'#8C99A6')+L(cx-30,ust+40,cx+30,ust+40,2)+L(cx-30,ust+48,cx+30,ust+48,2)+L(cx-30,ust+56,cx+30,ust+56,2);
    s+=L(cx,ust,cx,ust+10,3);
  } else if(tur==='kiriş'){
    h=34; s+=R(cx-110,ust+12,220,22,'#C9572B')+L(cx-110,ust+23,cx+110,ust+23,2,'#7A2E14');
    s+=L(cx,ust,cx-60,ust+12,3)+L(cx,ust,cx+60,ust+12,3);
  } else { h=40; s+=R(cx-25,ust,50,40,'#ddd'); }
  return {svg:s, alt:ust+h};
}

function cizIp(g,s,r){
  var d=ipDuzen(g,s), n=d.n, S=g.S;
  var ZEM=470, rp=18, yT=72, gap=2*rp;
  var yukY = {kova:46,torba:56,motor:60,'kiriş':34}[g.yuk]||46;
  var yb0 = ZEM - yukY - rp - 10;
  var yb = yb0 - s.h*S;
  var say = d.yon? n+1 : n;
  var x0 = 430 - (say-1)*gap/2;
  var xs=[]; for(var i=0;i<say;i++) xs.push(x0+i*gap);
  var uc=[]; for(i=0;i<say;i++) uc.push({ust:null,alt:null});
  var donus=[];
  if(d.yon){ for(var k=n;k>=1;k--) donus.push({k:k,poz:((n-k)%2===0)?'ust':'alt'}); }
  else { for(k=n-1;k>=1;k--) donus.push({k:k,poz:((n-1-k)%2===0)?'alt':'ust'}); }
  donus.forEach(function(t){ uc[t.k][t.poz]='m'; uc[t.k-1][t.poz]='m'; });
  var elIdx = d.yon? n : n-1;
  if(d.yon) uc[elIdx].alt='el'; else uc[elIdx].ust='el';
  var o = DESEN + '<rect x="-2000" y="-2000" width="4800" height="4500" fill="url(#kare)"/>';
  // iskele
  var hedefY = ZEM - s.hedef*S;
  o += '<rect x="40" y="'+hedefY+'" width="170" height="14" fill="#E9C46A" stroke="'+INK+'" stroke-width="3"/>';
  o += L(60,hedefY+14,60,ZEM,4)+L(190,hedefY+14,190,ZEM,4)+L(60,hedefY+14,190,ZEM,2,'#8C7A5B')+L(190,hedefY+14,60,ZEM,2,'#8C7A5B');
  o += T(48,hedefY-10,'İskele '+m(s.hedef));
  o += L(210,hedefY,720,hedefY,2,'#2F7D4F','stroke-dasharray="8 7"');
  // tavan kirişi
  var minx=Math.min.apply(null,xs)-50, maxx=Math.max.apply(null,xs)+50;
  o += '<rect x="'+minx+'" y="26" width="'+(maxx-minx)+'" height="16" fill="url(#tarali)" stroke="'+INK+'" stroke-width="3"/>';
  o += zemin(ZEM);
  // el / ip yığını
  var elY, yigX = d.yon? xs[elIdx]+70 : xs[elIdx]+70;
  var cek = elYolu(g,s,r);
  if(d.yon){ elY = 230 + s.tutus; } else { elY = Math.max(yT+30, (yb-70) - s.tutus); }
  // yükseklik cetveli
  for(var mt=0; mt<=Math.ceil(s.hedef); mt++){ var yy=ZEM-mt*S; o+=L(232,yy,248,yy,2)+T(252,yy+6,mt+' m','font-size="13"'); }
  o += L(240,ZEM,240,ZEM-Math.ceil(s.hedef)*S,2);
  // ipler
  var ipC='#8A5A2B', ipW=4;
  for(i=0;i<say;i++){
    var u=uc[i], yu, ya;
    yu = u.ust==='m'? yT : (u.ust==='el'? elY : 42);
    ya = u.alt==='m'? yb : (u.alt==='el'? elY : (yb+ (n===1?rp:rp+2)));
    if(i===elIdx && d.yon){ yu=yT; ya=elY; }
    if(i===elIdx && !d.yon){ yu=elY; }
    o += L(xs[i],yu,xs[i],ya,ipW,ipC);
  }
  donus.forEach(function(t){
    var xa=xs[t.k-1], xb=xs[t.k], cx=(xa+xb)/2;

function cizKaldirac(g,s,r){
  var SC=200, ZEM=440, birim=44;
  var x0=150, xf=x0+s.p*birim, yf=ZEM-s.Hf*SC;
  var a=s.p*0.2, b=(12-s.p)*0.2;
  var inis = s.h*b/a; // m
  var th = Math.asin(Math.min(1, inis/b));
  var co=Math.cos(th), si=Math.sin(th);
  function nokta(dx){ return [xf+dx*co, yf+dx*si]; }
  var sol=nokta(-s.p*birim), sag=nokta((12-s.p)*birim);
  var o = DESEN + '<rect x="-2000" y="-2000" width="4800" height="4500" fill="url(#kare)"/>' + zemin(ZEM);
  // sekiler
  o += R(40, yf, x0-50, ZEM-yf, '#CDBFA6');
  // hedef çizgisi
  var hy = yf - s.hedef*SC;
  o += L(20, hy, sol[0]-92, hy, 2, '#2F7D4F','stroke-dasharray="7 6"')+T(sol[0]-84,sol[1]-96,'takoz için '+cm(s.hedef),'font-size="14" fill="#2F7D4F"');
  // kaya
  var ky = sol[1];
  o += '<path d="M'+(sol[0]-80)+' '+(ky)+'L'+(sol[0]-88)+' '+(ky-50)+'L'+(sol[0]-50)+' '+(ky-86)+'L'+(sol[0]+10)+' '+(ky-80)+'L'+(sol[0]+34)+' '+(ky-40)+'L'+(sol[0]+30)+' '+ky+'Z" fill="#A89F91" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"/>';
  o += T(sol[0]-70, ky-58, 'Kaya '+N(g.W), 'font-size="13"');
  // kalkma ölçüsü
  if(s.h>0.004){ o+=L(sol[0]-30,ky,sol[0]-30,yf,3,'#2F5FA8'); }
  // destek
  var taban = ZEM - Math.max(0, s.Hf-0.4)*SC;
  if(taban<ZEM) o+=R(xf-36, taban, 72, ZEM-taban, '#CDBFA6');
  o += '<path d="M'+(xf-26)+' '+taban+'L'+xf+' '+yf+'L'+(xf+26)+' '+taban+'Z" fill="#E8772E" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"/>';
  // çubuk
  var ny=-7*co, nx=7*si;
  o += '<path d="M'+(sol[0]+nx)+' '+(sol[1]+ny)+'L'+(sag[0]+nx)+' '+(sag[1]+ny)+'L'+(sag[0]-nx)+' '+(sag[1]-ny)+'L'+(sol[0]-nx)+' '+(sol[1]-ny)+'Z" fill="#FFC21A" stroke="'+INK+'" stroke-width="3"/>';
  for(var i=0;i<=12;i++){ var p=nokta((i-s.p)*birim); o+=L(p[0]-nx*0.9,p[1]-ny*0.9,p[0],p[1],2); if(i>0&&i<12) o+=T(p[0]-4,p[1]-14,String(i),'font-size="12" fill="#4E5D70"'); }
  // el
  o += el(sag[0], sag[1]-22, 'asagi').replace(/ y1="/,' y1="');
  o += T(sag[0]+18, sag[1]-30, 'Bastır', 'font-size="15"');
  // ölçüler
  o += '<g transform="translate(560,40)">'+R(0,0,220,82,'#FFFDF6','rx="10"')+T(10,23,'Yük kolu: '+s.p+' çizgi')+T(10,47,'Kuvvet kolu: '+(12-s.p)+' çizgi')+T(10,71,'Kaya kalktı: '+cm(s.h),'fill="#2F5FA8"')+'</g>';
  return o;
}

function cizRampa(g,s,r){

function disliYol(cx,cy,disler,aci){
  var rr=disler*2.4, dis=7, p='';
  for(var i=0;i<disler;i++){
    var a0=aci+i*2*Math.PI/disler, w=Math.PI/disler;
    var pts=[[rr-dis/2,a0-w*0.55],[rr+dis/2,a0-w*0.3],[rr+dis/2,a0+w*0.3],[rr-dis/2,a0+w*0.55]];
    pts.forEach(function(q,j){ var x=cx+q[0]*Math.cos(q[1]), y=cy+q[0]*Math.sin(q[1]); p+=(i===0&&j===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1); });
  }
  return p+'Z';
}
function cizDisli(g,s,r){

  }

  return o;

function cizBilesik(g,s,r){
  // palanga solda, ip çıkrığın tamburuna gider
  var n=s.n, S=g.S, ZEM=470, rp=16, yT=70, gap=2*rp;
  var yb0 = ZEM - 34 - rp - 12;
  var yb = yb0 - s.h*S;
  var x0 = 250 - (n-1)*gap/2;
  var xs=[]; for(var i=0;i<=n;i++) xs.push(x0+i*gap);
  var donus=[]; for(var k=n;k>=1;k--) donus.push({k:k,poz:((n-k)%2===0)?'ust':'alt'});
  var uc=xs.map(function(){return {ust:null,alt:null};});
  donus.forEach(function(t){ uc[t.k][t.poz]='m'; uc[t.k-1][t.poz]='m'; });
  var o = DESEN + '<rect x="-2000" y="-2000" width="4800" height="4500" fill="url(#kare)"/>' + zemin(ZEM);
  var hedefY = ZEM - g.hedef*S - 0;
  o += L(30,hedefY,520,hedefY,2,'#2F7D4F','stroke-dasharray="8 7"')+T(34,hedefY-8,'hedef '+m(s.hedef),'font-size="14" fill="#2F7D4F"');
  var minx=xs[0]-40, maxx=xs[n]+40;
  o += '<rect x="'+minx+'" y="26" width="'+(maxx-minx)+'" height="16" fill="url(#tarali)" stroke="'+INK+'" stroke-width="3"/>';
  var ipC='#8A5A2B';
  for(i=0;i<n;i++){ var u=uc[i]; var yu=u.ust==='m'?yT:42, ya=u.alt==='m'?yb:yb+rp+2; o+=L(xs[i],yu,xs[i],ya,4,ipC); }
  donus.forEach(function(t){ var xa=xs[t.k-1], xb=xs[t.k];
    if(t.poz==='ust') o+='<path d="M'+xa+' '+yT+'A'+rp+' '+rp+' 0 0 1 '+xb+' '+yT+'" fill="none" stroke="'+ipC+'" stroke-width="4"/>';
    else o+='<path d="M'+xa+' '+yb+'A'+rp+' '+rp+' 0 0 0 '+xb+' '+yb+'" fill="none" stroke="'+ipC+'" stroke-width="4"/>'; });
  // çıkrık
  var K=350, Dx=620, Dy=250, rd=g.r*K, Rpx=s.R*K;
  o += L(xs[n],yT,Dx-rd-6,Dy,4,ipC);
  var alt=[];
  donus.forEach(function(t){ var cx=(xs[t.k-1]+xs[t.k])/2; if(t.poz==='ust') o+=L(cx,42,cx,yT,4)+C(cx,yT,rp-3,'#FFC21A',3); else alt.push(cx); });
  var blokY=yb+rp+2, yukX=(xs[0]+xs[n-1])/2;
  if(n>=2){ o+=R(xs[0]-10,blokY,xs[n-1]-xs[0]+20,9,'#8C99A6'); alt.forEach(function(cx){o+=C(cx,yb,rp-3,'#FFC21A',3)+L(cx,yb,cx,blokY,3);}); }
  var yk=yukCiz('kiriş',yukX,n>=2?blokY+9:yb+rp);
  if(n===1) o+=L(yukX,yb,yukX,yb+rp,4,ipC);
  o += yk.svg;
  for(i=0;i<n;i++){ var ty=(yT+yb)/2; o+='<circle cx="'+xs[i]+'" cy="'+ty+'" r="11" fill="#2F5FA8" stroke="'+INK+'" stroke-width="2"/><text x="'+xs[i]+'" y="'+(ty+5)+'" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">'+(i+1)+'</text>'; }
  // çıkrık gövdesi
  o += L(Dx-50,ZEM,Dx,Dy,8,'#8A5A2B')+L(Dx+50,ZEM,Dx,Dy,8,'#8A5A2B');
  var sarilan=n*s.h;
  o += C(Dx,Dy,rd+6+Math.min(10,sarilan*2),'#C08A50',3);
  o += '<circle cx="'+Dx+'" cy="'+Dy+'" r="'+Rpx+'" fill="none" stroke="#E0362C" stroke-width="2" stroke-dasharray="6 6"/>';
  var hx=Dx+Rpx*Math.cos(s.aci), hy=Dy+Rpx*Math.sin(s.aci);
  o += L(Dx,Dy,hx,hy,8,INK)+C(hx,hy,14,'#FFC21A',3)+T(Dx-24,Math.min(Dy+Rpx+34,490),'Çevir','font-size="14"');
  o += '<g transform="translate(560,40)">'+R(0,0,220,82,'#FFFDF6','rx="10"')+T(10,24,'Silindirdeki ip: '+m(sarilan))+T(10,48,'Sınır: '+m(g.tambur))+T(10,72,'Kol: '+cm(s.R))+'</g>';
  return o;
}

var cizBekliyor=false;
function ciz(){
  if(cizBekliyor) return;
  cizBekliyor=true;
  requestAnimationFrame(function(){ cizBekliyor=false; cizHemen(); });
}
function cizHemen(){
  var g=G[aktif], s=S, r=hesap(g,s), o;
  if(g.tur==='ip') o=cizIp(g,s,r);
  else if(g.tur==='kaldirac') o=cizKaldirac(g,s,r);
  else if(g.tur==='rampa') o=cizRampa(g,s,r);
  else if(g.tur==='cikrik') o=cizCikrik(g,s,r);
  else if(g.tur==='disli') o=cizDisli(g,s,r);
  else o=cizBilesik(g,s,r);
  svg.innerHTML=o;
  olcumCiz(g,s,r);
  var not=$('#sahneNot');
  if(not.textContent!==(s.uyari||'')) not.textContent = s.uyari || '';
  not.style.color = s.uyari? '#9E1F17' : '';
  not.style.fontWeight = s.uyari? '700':'400';
}
function duyur(t){ var d=$('#duyuru'); d.textContent=''; setTimeout(function(){ d.textContent=t; },30); }

function olcumCiz(g,s,r){
  var o='';

    $('#olcum').innerHTML=o; return;
  }
  var maxF=Math.max(g.W, s.kol)*1.05;

  o+='<div class="kutu'+(r.yetmez?' sinirli':'')+'"><div class="kh">Giriş kuvveti (dinamometre)</div><div class="deger">'+N(r.F)+' <span class="kucuk">/ sınırın '+N(s.kol)+'</span></div>'+

  var Fd=yuv(r.F,Nond(r.F)), dd=yuv(d,mond(d)), hd=yuv(s.h,mond(s.h));

     '<div class="is-satir" style="margin-top:3px">Yüke yapılan: '+N(g.W)+' × '+m(s.h)+' = <b>'+J(isYuk)+'</b></div>'+

     '<div class="cubuk" aria-hidden="true"><i class="yuk" style="width:'+Math.min(100,isYuk/isMax*100)+'%;background:#2F5FA8"></i></div></div>';

}

/* ---------- eylem ---------- */
function ilerlet(dm){ // el yolunda dm metre ilerle
  var g=G[aktif], s=S, r=hesap(g,s);
  if(s.asama==='tahmin'){ s.uyari='Önce tahminini seç.'; ciz(); return false; }
  if(s.basarili) return false;
  if(g.tur==='disli') return false;
  if(g.tur==='rampa' && r.engel){ s.uyari='Rampa duvara çarpıyor. Rampayı kısalt.'; ciz(); return false; }
  if(r.yetmez && dm>0){ s.uyari='Gereken giriş kuvveti '+N(r.F)+', senin sınırın '+N(s.kol)+'. Düzeneği değiştir.'; ciz(); return false; }
  var hedefH = Math.min(s.hedef, r.hMax);
  var taban = (s.hRaw===undefined || Math.abs(s.hRaw-s.h)>=0.01) ? s.h : s.hRaw;
  var yeni = taban + dm/r.MA;
  if(yeni<0) yeni=0;
  var takildi=false;
  if(yeni>=hedefH){ yeni=hedefH; takildi = hedefH < s.hedef-1e-9; }
  s.hRaw=yeni; s.uyari='';
  /* ekrandaki çarpımlar tutsun: yük santimetre adımıyla yükselir */
  s.h = (yeni>=hedefH-1e-9) ? yeni : Math.floor(yeni*100+1e-9)/100;
  if(takildi){ s.uyari=r.neden; }
  if(s.h>=s.hedef-1e-9) basardi();
  ciz();
  return !takildi && s.h<s.hedef-1e-9;
}
function basardi(){
  var s=S, g=G[aktif];
  if(s.basarili) return;
  s.basarili=true;
  if(s.kanitAcik){ s.kanitBitti=true; s.asama='kanitBitti'; }
  else s.asama='acikla';
  ilerleme.bitti[g.id]=true; yaz(ilerleme);
  tutBitir();
  panel(); liste();
  duyur(sonucMetni(g,s));
  odakla(s.asama==='acikla'?'[data-aciklama="0"]':'#sonraki, #yenidenDene');
}
function sonucMetni(g,s){
  var r=hesap(g,s);
  if(s.asama==='kanitBitti'){ var k=g.kanit.sonuc; return typeof k==='function'? k(s,g,r) : k; }
  return g.sonuc;
}
function sifirlaHareket(){ S.h=0; S.hRaw=0; S.aci=0; S.tutus=0; S.uyari=''; S.basarili=false; }

/* sürükleme */
var surukle=null;
function svgNokta(e){
  var pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  var ctm=svg.getScreenCTM(); if(!ctm) return {x:0,y:0};
  var p=pt.matrixTransform(ctm.inverse()); return {x:p.x,y:p.y};
}
function merkez(g,s){
  if(g.tur==='cikrik') return {x:380,y:128};
  if(g.tur==='bilesik') return {x:620,y:250};
  if(g.tur==='disli') return {x:230,y:260};
  return null;
}
var KAL={x0:150,birim:44,ZEM:440,SC:200};
svg.addEventListener('pointerdown',function(e){
  var g=G[aktif];
  if(S.asama==='tahmin'){ S.uyari='Önce tahminini seç.'; ciz(); return; }
  if(surukle) return; // ikinci parmak
  try{ svg.setPointerCapture(e.pointerId); }catch(er){}
  var p=svgNokta(e), c=merkez(g,S);
  surukle={id:e.pointerId,x:p.x,y:p.y,a:c?Math.atan2(p.y-c.y,p.x-c.x):0,destek:false};
  if(g.tur==='kaldirac' && (S.asama==='dene'||S.asama==='kanit')){
    var xf=KAL.x0+S.p*KAL.birim, yf=KAL.ZEM-S.Hf*KAL.SC;
    if(Math.abs(p.x-xf)<36 && p.y>yf-14) surukle.destek=true;
  }
  e.preventDefault();
});
svg.addEventListener('pointermove',function(e){
  if(!surukle||e.pointerId!==surukle.id) return;
  var g=G[aktif], s=S, p=svgNokta(e), dx=p.x-surukle.x, dy=p.y-surukle.y;
  surukle.x=p.x; surukle.y=p.y;
  if(s.asama!=='dene' && s.asama!=='kanit') return;
  if(g.tur==='ip'){
    var d=ipDuzen(g,s), adim = (d.yon? dy : -dy)/g.S;
    if(adim<=0) return;
    var onceH=hHam(s);
    ilerlet(adim);
    s.tutus += (hHam(s)-onceH)*hesap(g,s).MA*g.S;
    if(s.tutus>(d.yon? 220 : 160)) s.tutus=0;
  } else if(g.tur==='kaldirac'){
    if(surukle.destek){
      var yp=Math.round((p.x-KAL.x0)/KAL.birim); if(yp<1) yp=1; if(yp>11) yp=11;
      if(yp!==s.p){ s.p=yp; sifirlaHareket(); panel(); ciz(); }
      return;
    }
    if(dy<=0) return; ilerlet(dy/KAL.SC);
  } else if(g.tur==='rampa'){
    var r=hesap(g,s), ux=r.yatay/s.L, uy=-g.hedef/s.L;
    var proj=(dx*ux+dy*uy)/100; if(proj<=0) return; ilerlet(proj);
  } else {
    var c=merkez(g,s), a=Math.atan2(p.y-c.y,p.x-c.x), da=a-surukle.a;
    if(da>Math.PI) da-=2*Math.PI; if(da<-Math.PI) da+=2*Math.PI;
    surukle.a=a;
    dondur(da);
  }
});
function dondur(da){
  var g=G[aktif], s=S;
  if(s.asama!=='dene' && s.asama!=='kanit') return;
  if(g.tur==='disli'){
    s.aci+=da; ciz(); disliKontrol(); return;
  }
  if(da<=0) return;
  var r=hesap(g,s);
  var onceH=hHam(s);
  ilerlet(da*s.R);
  s.aci+=(hHam(s)-onceH)*r.MA/s.R; ciz();
}
function disliKontrol(){
  var s=S;
  var turA=Math.abs(s.aci)/(2*Math.PI);
  if(turA>=1 && s.A/s.B===3 && s.zincir && !s.basarili){ basardi(); ciz(); }
  else if(turA>=1 && !s.basarili){
    var oran=s.A/s.B;
    if(!s.zincir) s.uyari='Teker ters yöne dönüyor. Pedalla aynı yöne dönmesi gerekiyor.';
    else if(oran!==3) s.uyari='Bir pedal turunda teker '+sayi(oran,2)+' tur döndü. 3 tur gerekiyor.';
    ciz();
  }
}
function birak(e){ if(surukle && (!e || e.pointerId===surukle.id)){ surukle=null; if(G[aktif].tur==='ip'){ S.tutus=0; ciz(); } } }
svg.addEventListener('pointerup',birak); svg.addEventListener('pointercancel',birak);
svg.addEventListener('contextmenu',function(e){ e.preventDefault(); });

/* basılı tutunca çek */
var tutZaman=null;
function tutBasla(){
  if(tutZaman) return;
  var son=performance.now();
  function adim(t){
    var dt=Math.min(0.05,(t-son)/1000); son=t;
    var g=G[aktif];
    if(g.tur==='ip'||g.tur==='kaldirac'||g.tur==='rampa'){
      var hiz = g.tur==='kaldirac'?0.12:1.0;
      var r=hesap(g,S), once=hHam(S);
      var dev=ilerlet(hiz*dt);
      if(g.tur==='ip'){ var d=ipDuzen(g,S); S.tutus += (hHam(S)-once)*r.MA*g.S; if(S.tutus>(d.yon?220:160)) S.tutus=0; }
      if(!dev){ tutBitir(); return; }
    } else {
      dondur(2*Math.PI*(g.tur==='disli'?0.9:1.1)*dt);
      if(S.basarili || (g.tur!=='disli' && S.uyari)){ tutBitir(); return; }
    }
    tutZaman=requestAnimationFrame(adim);
  }
  tutZaman=requestAnimationFrame(adim);
}
function tutBitir(){ if(tutZaman){ cancelAnimationFrame(tutZaman); tutZaman=null; } if(G[aktif].tur==='ip' && S.tutus){S.tutus=0;ciz();} }

function adimlarHTML(s,g){

function metin(x,s,g,r){ return typeof x==='function'? x(s,g,r) : x; }

      (g.ipMax?'<span class="etiket">İp: '+m(g.ipMax)+'</span>':'')+(g.yer?'<span class="etiket">Yer: '+m(g.yer)+'</span>':'')+(g.tambur?'<span class="etiket">Silindire en çok: '+m(g.tambur)+'</span>':'')+'</div>';

function aracSVG(a){ return '<svg viewBox="0 0 80 60" aria-hidden="true">'+a.s+'</svg>'; }
function sinifCiz(){
  var o='';
  ARAC.forEach(function(a,i){ if(!sinifDurum.yer[i]) o+='<button type="button" class="arac" data-a="'+i+'" aria-pressed="'+(sinifDurum.secili===i)+'">'+aracSVG(a)+esc(a.ad)+'</button>'; });
  if(!o) o='<div class="geri iyi"><b>Hepsi yerinde.</b> Gruplara bak: her grupta aracı çalıştıran ortak parça hangisi?</div>';
  var ka=$('#kartlar'); ka.innerHTML=o;
  if(!Object.keys(sinifDurum.yer).length && ka.offsetHeight && !ka.style.minHeight) ka.style.minHeight=ka.offsetHeight+'px';
  var k='';
  AILE.forEach(function(f){
    k+='<div class="aile" data-f="'+f.id+'" role="button" tabindex="0" aria-label="'+esc(f.ad)+' grubu"><h3><svg viewBox="0 0 32 32" aria-hidden="true">'+f.ikon+'</svg>'+esc(f.ad)+'</h3><div class="icerik">';
    ARAC.forEach(function(a,i){ if(sinifDurum.yer[i]===f.id) k+='<div class="arac yerde">'+aracSVG(a)+esc(a.ad)+'</div>'; });
    k+='</div></div>';
  });
  $('#kutular').innerHTML=k;
}
function yerlestir(i,f){
  var a=ARAC[i];
  if(a.a===f || (a.kabul && a.kabul.indexOf(f)>=0)){ sinifDurum.yer[i]=f; sinifDurum.secili=null; $('#sinifGeri').className='geri iyi'; $('#sinifGeri').textContent=a.ad+': '+adBul(f)+'. '+a.ip+(a.a!==f?' Asıl grubu: '+adBul(a.a)+'.':''); }
  else { sinifDurum.yanlis[i]=(sinifDurum.yanlis[i]||0)+1; $('#sinifGeri').className='geri'; $('#sinifGeri').textContent=a.ad+' için bir daha düşün. '+a.ip; }
  sinifCiz();
  if(sinifDurum.yer[i]) odakla('#kartlar [data-a]'); else odakla('#kartlar [data-a="'+i+'"]');
}
function adBul(f){ var r=''; AILE.forEach(function(x){ if(x.id===f) r=x.ad; }); return r; }
$('#kartlar').addEventListener('click',function(e){ if(surukBitti) return; var b=e.target.closest('[data-a]'); if(!b) return; var i=+b.getAttribute('data-a'); sinifDurum.secili = sinifDurum.secili===i? null : i; sinifCiz(); odakla('#kartlar [data-a="'+i+'"]'); });
$('#kutular').addEventListener('click',function(e){ var k=e.target.closest('.aile'); if(!k||sinifDurum.secili===null) { if(k && sinifDurum.secili===null){ $('#sinifGeri').className='geri'; $('#sinifGeri').textContent='Önce yukarıdan bir araç seç.'; } return; } yerlestir(sinifDurum.secili,k.getAttribute('data-f')); });
$('#kutular').addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('aile')){ e.preventDefault(); e.target.click(); } });
$('#sinifBastan').addEventListener('click',function(){ sinifDurum={yer:{},secili:null,yanlis:{}}; $('#sinifGeri').className='geri'; $('#sinifGeri').textContent='Çevrende her gün kullandığın araçlar. Hangi gruba girdiklerini bul.'; sinifCiz(); });
// sürükle bırak (dokunma)
(function(){
  var tas=null, hayalet=null, basX=0, basY=0;
  $('#kartlar').addEventListener('pointerdown',function(e){ var b=e.target.closest('[data-a]'); if(!b) return; tas={i:+b.getAttribute('data-a'),el:b,id:e.pointerId}; basX=e.clientX; basY=e.clientY; });
  document.addEventListener('pointermove',function(e){
    if(!tas||e.pointerId!==tas.id) return;
    if(!hayalet && Math.abs(e.clientX-basX)+Math.abs(e.clientY-basY)>12){
      hayalet=tas.el.cloneNode(true); hayalet.style.position='fixed'; hayalet.style.pointerEvents='none'; hayalet.style.zIndex=9; hayalet.style.opacity='.9'; document.body.appendChild(hayalet);
    }
    if(hayalet){ hayalet.style.left=(e.clientX-56)+'px'; hayalet.style.top=(e.clientY-48)+'px';
      $$('.aile').forEach(function(k){ var r=k.getBoundingClientRect(); k.classList.toggle('hedefle', e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom); }); }
  });
  document.addEventListener('pointercancel',function(e){ if(!tas||e.pointerId!==tas.id) return; if(hayalet&&hayalet.parentNode) hayalet.parentNode.removeChild(hayalet); hayalet=null; tas=null; $$('.aile').forEach(function(k){k.classList.remove('hedefle');}); });
  document.addEventListener('pointerup',function(e){
    if(!tas||e.pointerId!==tas.id) return;
    if(hayalet){
      var hedef=null; $$('.aile').forEach(function(k){ var r=k.getBoundingClientRect(); if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) hedef=k.getAttribute('data-f'); k.classList.remove('hedefle'); });
      hayalet.parentNode.removeChild(hayalet); hayalet=null;
      var i=tas.i; tas=null;
      if(hedef){ sinifDurum.secili=null; yerlestir(i,hedef); }
      setTimeout(function(){},0);
      surukBitti=true; setTimeout(function(){surukBitti=false;},50);
      return;
    }
    tas=null;
  });
})();
