<!-- Müze site kapısı: build.py bu parçayı müze sayfasının </body> önüne ekler. Müze dosyası (muze.html) değişince buna dokunulmaz.
     Siteye dönüş: üst çubuğun sol başına "← logo Herkese Eğitim" bağlantısı eklenir, İçinde Ne Var? listesine döner (dar ekranda yalnız ← ve logo).
     Zaman koridoru: Kaset "Buradasınız", Disket sitedeki disket sayfasına gider, "Sıradaki" kutusu defteri açar. Koridor bulunamazsa hiçbir şey yapmaz.
     Defter: adres ?defter=1 ile açılırsa öneri defteri açık başlar (ana sayfadaki müze bandının örtülü vitrini).
     Video: build.py'nin eklediği "Videosu" düğmesi üst çubuğa, ışık düğmesinin soluna alınır (telefonda yalnız simge).
     Vitrinler: yayındaki vitrinler build.py'nin doldurduğu VITRIN listesinden gelir. Sayfada kutusu olan vitrin (başka vitrinin sayfasındaki "Kaset") bağlantıya döner, olmayan (Kaset sayfasında "Çevirmeli telefon") Disket'in önüne eklenir. Açık vitrinin kutusuna dokunulmaz.
     Hat meşgul: bolumler.json'da "durum": "mesgul" olan vitrin, build.py'nin doldurduğu MESGUL listesinden koridora Disket'in önüne girer; vitrine değil videoya bağlanır. -->
<style>.top .hev-don{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;min-height:36px;padding:0 12px 0 6px;margin-right:2px;border-radius:8px;color:inherit;text-decoration:none;font:600 13px/1 "Inter",system-ui,sans-serif;white-space:nowrap;box-shadow:inset -1px 0 0 rgba(217,203,176,.35);border-top-right-radius:0;border-bottom-right-radius:0}.top .hev-don:hover span{text-decoration:underline;text-underline-offset:3px}.top .hev-don:focus-visible{outline:2px solid #e8a35a;outline-offset:2px}.top .hev-don i{font:700 19px/1 system-ui,sans-serif;font-style:normal;margin-top:-2px}.top .hev-don svg{width:24px;height:20px;display:block}@media (max-width:820px){.top .hev-don{gap:4px;padding:0 8px 0 2px;min-height:40px}.top .hev-don span{display:none}.top .hev-don svg{width:21px;height:18px}}@media (max-width:480px){.top .hev-don{padding:0 6px 0 0;gap:3px;margin-right:0}.top .brand::before{display:none}}@media (max-width:370px){.top .brand{font-size:14px}.top .prog .pl{display:none}}</style><style>.top #hev-ac{position:static;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;margin:0;border:1.5px solid rgba(245,230,200,.55);border-radius:17px;background:transparent;color:#f5e6c8;font:600 13.5px/1 "Inter",system-ui,sans-serif;cursor:pointer;white-space:nowrap}.top #hev-ac:hover{background:rgba(245,230,200,.12)}.top #hev-ac:focus-visible{outline:2px solid #e8a35a;outline-offset:2px}.top #hev-ac i{font-style:normal;font-size:11px}@media (max-width:820px){.top #hev-ac{height:30px;padding:0 10px;font-size:12.5px}}@media (max-width:560px){.top #hev-ac{width:40px;height:36px;padding:0;justify-content:center}.top #hev-ac span{display:none}.top #hev-ac i{font-size:13px}.top .prog .pl{display:none}}</style><style>@media (max-width:820px){.top .hev-don{min-height:44px}.top #hev-ac{height:44px}}@media (max-width:560px){.top #hev-ac{width:44px;height:44px}}@media (max-height:520px) and (min-width:560px){.top{gap:8px}.top .hev-don{min-height:44px;padding:0 8px 0 2px;gap:4px}.top .hev-don span{display:none}.top #hev-ac{width:44px;height:44px;padding:0;justify-content:center}.top #hev-ac span{display:none}.top .isikb{flex:none}}</style><style>.koridor a.ki{text-decoration:none;cursor:pointer}.koridor a.ki:hover b,.koridor a.ki:focus-visible b{text-decoration:underline}.koridor a.ki:focus-visible,.koridor button.ki:focus-visible{outline:2px solid #e8a35a;outline-offset:2px}.koridor button.ki{font:inherit;border:0;margin:0;text-align:left;cursor:pointer;color:inherit}.koridor button.ki.bos{text-align:center}</style><style>.koridor .ki.mesgul{width:auto;min-width:216px;color:inherit;box-shadow:inset 0 0 0 1.5px rgba(232,163,90,.6)}.koridor .ki.mesgul svg{color:#e8a35a;stroke:none}.koridor .ki.mesgul .dut{animation:hevDut 1s steps(1,end) infinite}@keyframes hevDut{0%{opacity:1}50%{opacity:.15}}@media (prefers-reduced-motion:reduce){.koridor .ki.mesgul .dut{animation:none}}</style>
<script>(function(){
var DISKET="/icinde-ne-var/disket-usb/";
var DON="/icinde-ne-var/";
var MESGUL=null/*hev-mesgul*/;
function mesgul(l){
 if(!MESGUL||!MESGUL.length||l.querySelector(".ki.mesgul"))return;
 var ref=null;Array.prototype.forEach.call(l.querySelectorAll(".ki"),function(d){var b=d.querySelector("b");if(!ref&&(d.classList.contains("bos")||(b&&/^Disket/.test(b.textContent.trim()))))ref=d;});
 MESGUL.forEach(function(m){
  var e=document.createElement(m.video?"a":"div");e.className="ki mesgul";
  if(m.video){e.href="https://www.youtube.com/shorts/"+m.video;e.target="_blank";e.rel="noopener";e.setAttribute("aria-label","Vitrin "+("0"+m.no).slice(-2)+", "+m.baslik+". "+m.alt+". Videosunu YouTube'da izleyin");}
  e.innerHTML='<svg viewBox="0 0 36 27" aria-hidden="true" focusable="false"><path class="dut" d="M7 5h5M15.5 5h5M24 5h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M3 19.5c0-5 6.5-8 15-8s15 3 15 8l-1.2 3.3h-6.3l-1.3-3.4c-2-.6-4.3-.9-6.2-.9s-4.2.3-6.2.9l-1.3 3.4H4.2z" fill="currentColor"/></svg><div><b></b><span></span></div>';
  e.querySelector("b").textContent=m.baslik;e.querySelector("span").textContent=m.alt.split(". ")[0];if(!m.video)e.setAttribute("title",m.alt);
  l.insertBefore(e,ref);
 });
}
var VITRIN=null/*hev-vitrin*/;
var VK={telefon:'<path d="M5 25l3-13h20l3 13z"/><circle cx="18" cy="18.5" r="4.6"/><path d="M4 9c0-6 28-6 28 0v3h-6V9.5c-3-1.6-13-1.6-16 0V12H4z"/>',kaset:'<rect x="2" y="3" width="32" height="21" rx="2"/><circle cx="12" cy="12" r="3.5"/><circle cx="24" cy="12" r="3.5"/><path d="M9 24l2-5h14l2 5"/>'};
function vitrinler(l){
 if(!VITRIN||!VITRIN.length)return;
 var ilk=document.documentElement.getAttribute("data-ilk")||"kaset",ref=null;
 Array.prototype.forEach.call(l.querySelectorAll(".ki"),function(d){var b=d.querySelector("b");if(!ref&&(d.classList.contains("bos")||(b&&/^Disket/.test(b.textContent.trim()))))ref=d;});
 VITRIN.forEach(function(v){
  if(v.slug===ilk)return;
  var var_=null;Array.prototype.forEach.call(l.querySelectorAll(".ki"),function(d){var b=d.querySelector("b");if(b&&b.textContent.trim()===v.ad)var_=d;});
  if(var_&&(var_.classList.contains("simdi")||var_.tagName==="A"))return;
  var a=document.createElement("a");a.className="ki";a.href=v.url;a.setAttribute("aria-label","Vitrin "+("0"+v.no).slice(-2)+", "+v.ad+": vitrini açın");
  a.innerHTML='<svg viewBox="0 0 36 27" aria-hidden="true" focusable="false" fill="none">'+(VK[v.slug]||'<rect x="4" y="3" width="28" height="21" rx="2"/>')+'</svg><div><b></b><span></span></div>';
  a.querySelector("b").textContent=v.ad;a.querySelector("span").textContent=v.donem||"";
  if(var_)var_.parentNode.replaceChild(a,var_);else l.insertBefore(a,ref);
 });
}
function don(){
 var t=document.querySelector(".world .top");if(!t||t.querySelector(".hev-don"))return;
 var a=document.createElement("a");a.className="hev-don";a.href=DON;a.setAttribute("aria-label","Herkese Eğitim'e dön: İçinde Ne Var?");
 a.innerHTML='<i aria-hidden="true">←</i><svg viewBox="0 0 60 44" aria-hidden="true"><circle cx="12" cy="15" r="8" fill="#E8731A"/><circle cx="30" cy="10" r="9.5" fill="#D62828"/><circle cx="48" cy="15" r="8" fill="#E8731A"/><path d="M8 32 Q30 46 52 32" fill="none" stroke="#D62828" stroke-width="5" stroke-linecap="round"/></svg><span>Herkese Eğitim</span>';
 t.insertBefore(a,t.firstChild);
}
function video(){
 var v=document.getElementById("hev-ac"),t=document.querySelector(".world .top"),ib=t&&t.querySelector(".isikb");if(!v||!t||v.parentNode===t)return;
 v.innerHTML='<i aria-hidden="true">▶</i><span>Videosu</span>';v.setAttribute("aria-label","Videosunu izleyin");v.removeAttribute("style");
 t.insertBefore(v,ib||null);
}
function kur(){
 don();video();
 var l=document.querySelector(".koridor .kl");if(!l||l.getAttribute("data-kapi"))return;l.setAttribute("data-kapi","1");
 mesgul(l);vitrinler(l);
 Array.prototype.forEach.call(l.querySelectorAll(".ki"),function(d){
  var b=d.querySelector("b"),t=b?b.textContent.replace(/[:\s]+$/,"").trim():"";
  if(d.classList.contains("simdi")){
   Array.prototype.forEach.call(d.querySelectorAll("span"),function(s){if(/^Bu vitrin$/i.test(s.textContent.trim()))s.textContent="Buradasınız";});
   d.setAttribute("aria-current","page");
  }else if(t==="Disket"&&d.tagName!=="A"){
   var a=document.createElement("a");a.className=d.className;a.href=DISKET;a.innerHTML=d.innerHTML;
   a.setAttribute("aria-label","Disket: İçinde Ne Var? disket sayfasını açın");d.parentNode.replaceChild(a,d);
  }else if(d.classList.contains("bos")&&d.tagName!=="BUTTON"&&!d.querySelector("button,a")){
   var k=document.createElement("button");k.type="button";k.className=d.className;k.setAttribute("data-act","defter");k.innerHTML=d.innerHTML;
   k.setAttribute("aria-label","Sıradaki vitrin için öneri defterini açın");d.parentNode.replaceChild(k,d);
  }
 });
 defter();
}
function defter(){ /* ?defter=1: ana sayfadaki örtülü vitrin buraya gelir, öneri defteri açık başlar (?cekim=1 gibi) */
 try{if(!/[?&]defter=1(&|$)/.test(location.search))return;}catch(_){return;}
 var k=document.querySelector('.koridor [data-act="defter"]')||document.querySelector('.rail [data-act="defter"]'),w=document.querySelector(".world");
 if(k&&w&&!w.classList.contains("do"))k.click();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",kur);else kur();
})();</script>
