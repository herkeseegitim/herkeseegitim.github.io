<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="c"><circle cx="200" cy="200" r="196"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%"><stop offset="0" stop-color="#2B3C48"/><stop offset="1" stop-color="#141F27"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB45E" stop-opacity=".55"/><stop offset=".5" stop-color="#E8873F" stop-opacity=".18"/><stop offset="1" stop-color="#E8873F" stop-opacity="0"/></radialGradient>
    <!-- facets lit from the inner seam -->
    <linearGradient id="fA" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFE7BF"/><stop offset="1" stop-color="#F4E9D6"/></linearGradient>
    <linearGradient id="fB" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FFD9A0"/><stop offset=".6" stop-color="#EEDFC4"/></linearGradient>
    <linearGradient id="fC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCC7A4"/><stop offset="1" stop-color="#C7AE88"/></linearGradient>
    <linearGradient id="fD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9EE"/><stop offset="1" stop-color="#F1E4CD"/></linearGradient>
    <pattern id="t" width="46" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)">
      <line x1="3" y1="6" x2="25" y2="6" stroke="#7E6A55" stroke-width="1.2" opacity=".28"/><line x1="29" y1="6" x2="42" y2="6" stroke="#7E6A55" stroke-width="1.2" opacity=".28"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g clip-path="url(#c)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <circle cx="208" cy="214" r="150" fill="url(#halo)"/>

    <g transform="translate(204 210) scale(1.16) translate(-206 -224)">
<!-- light leaking from the folds (behind paper) -->
    <path d="M150 196 L250 248 L214 300" stroke="#FFB45E" stroke-width="14" fill="none" filter="url(#soft)" opacity=".9"/>

    <g stroke="#FBF2E2" stroke-width="1.4" stroke-linejoin="round">
      <!-- tail: two crisp folds -->
      <polygon points="262,250 344,236 300,280" fill="url(#fC)"/>
      <polygon points="262,250 300,280 270,286" fill="#B99E78"/>
      <!-- lower body -->
      <polygon points="150,196 250,248 214,300" fill="url(#fB)"/>
      <polygon points="150,196 214,300 150,286" fill="url(#fC)"/>
      <polygon points="214,300 262,250 250,248" fill="#D6C09C"/>
      <!-- wing: big raised sheet -->
      <polygon points="166,198 306,150 248,252" fill="url(#fA)"/>
      <polygon points="166,198 248,252 212,256" fill="#E8D6B6"/>
      <!-- head: origami diamond -->
      <polygon points="150,196 120,132 166,150" fill="url(#fD)"/>
      <polygon points="150,196 120,132 106,180" fill="#E4D1B0"/>
      <polygon points="120,132 166,150 148,128" fill="#FFFDF7"/>
      <!-- beak -->
      <polygon points="106,160 78,170 106,178" fill="#F0A04A" stroke="none"/>
      <polygon points="106,170 78,170 106,178" fill="#D48537" stroke="none"/>
    </g>
    <!-- words on the paper -->
    <polygon points="166,198 306,150 248,252" fill="url(#t)"/>
    <polygon points="150,196 250,248 214,300" fill="url(#t)"/>
    <polygon points="150,196 120,132 166,150" fill="url(#t)"/>

    <!-- lit seams -->
    <path d="M166 198 L248 252" stroke="#FFC774" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M150 196 L214 300" stroke="#FFC774" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>

    <!-- eye -->
    <circle cx="127" cy="160" r="5.6" fill="#1D2A33"/>
    <circle cx="128.8" cy="158.2" r="1.8" fill="#FFF"/>

    <!-- one mote of light it is looking at -->
    <circle cx="90" cy="136" r="15" fill="#FFCB80" opacity=".18"/>
    <circle cx="90" cy="136" r="5.5" fill="#FFD796"/>

    <!-- legs + perch: a line of handwriting-like light -->
    <path d="M176 300 l-5 30 M196 302 l1 28" stroke="#C99B5E" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M96 334 C 140 326, 180 338, 220 330 S 300 326, 330 334" stroke="#FFC774" stroke-width="3.4" fill="none" stroke-linecap="round" opacity=".85"/>
  </g>
</g>
  <circle cx="200" cy="200" r="196" fill="none" stroke="#F3E8D4" stroke-width="6"/>
</svg>
